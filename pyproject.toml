[project]
name = "agent-tools"
version = "0.1.0"
description = "Reusable AI agent registry with capability checks, access profiles, and multi-repo rollout for GitHub Copilot and autonomous coding agents"
readme = "README.md"
requires-python = ">=3.11"
# Core `agentx` commands use the standard library only. Optional providers
# and backends are extras so a base install can run `agentx list`.
dependencies = []
keywords = [
  "ai-agents",
  "agent-registry",
  "github-copilot",
  "copilot-agents",
  "autonomous-agents",
  "capability-checks",
  "access-profiles",
  "multi-repo",
  "devtools",
  "agentx",
  "llm-tooling",
  "agent-orchestration",
]

authors = [
  { name = "Unwrenchable" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

[project.scripts]
agentx = "agent_tools.cli:main"
agent-tools = "agent_tools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# RealAI chat + embeddings client (`requests` is imported lazily).
realai = ["requests>=2.31"]
# Persistent vector memory (`chromadb` is imported lazily).
chroma = ["chromadb>=0.4"]
# Approval and memory inspector UIs (`flask` is imported lazily).
ui = ["flask>=3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "agent_tools",
  "agent_tools.engine",
  "agent_tools.tooling",
  "agent_tools.providers",
]

[tool.setuptools.package-data]
agent_tools = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
